spring.application.name=weekloop-backend
server.port=8080

# Cấu hình kết nối MySQL Database todohuy
spring.datasource.url=jdbc:mysql://localhost:3306/todohuy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret & thời hạn 7 ngày (604800000 ms)
jwt.secret=WeekLoopSuperSecureJwtSecretKeyForPersonalTaskTracker2026WithAtLeast256BitsOfEntropy!
jwt.expirationMs=604800000
