spring.application.name=weekloop-backend
server.port=${PORT:8080}

# Cấu hình kết nối MySQL / TiDB Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/todohuy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Secret & thời hạn 7 ngày
jwt.secret=${JWT_SECRET:WeekLoopSuperSecureJwtSecretKeyForPersonalTaskTracker2026WithAtLeast256BitsOfEntropy!}
jwt.expirationMs=604800000

